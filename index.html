<!-- Politique de sécurité du contenu, en balise : GitHub Pages ne permet aucun
     en-tete HTTP personnalise. Identique a celle posee par nginx dans le
     Dockerfile, moins `frame-ancestors`, qu'une balise ne peut pas porter.

     Aucun script distant : le moteur MapLibre est servi par le site lui-meme
     (`js/vendor/`). Autoriser un CDN entier dans `script-src` reviendrait a
     autoriser n'importe quel paquet qu'il heberge, et viderait cette politique
     de son sens.

     Restent des hotes distants qui ne fournissent que des donnees, jamais du
     code executable : les tuiles OpenStreetMap et le calcul
     d'itineraire OSRM. `worker-src blob:` est exige par MapLibre, qui
     fabrique ses workers a partir d'un Blob. Sans ces autorisations la carte
     bascule sur son repli simplifie. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://router.project-osrm.org; worker-src 'self' blob:; child-src 'self' blob:; frame-src http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'">
