<body>

  <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>

  <symbol id="ic-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
  <symbol id="ic-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></symbol>

  <symbol id="ic-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="ic-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11"/></symbol>

<!-- ===================================================================
     Bandeau de démonstration.
     Il n'appartient PAS au produit : il pilote la maquette (rôle, écran,
     thème) et rappelle que les données sont fictives (risque R7 / R9).
     =================================================================== -->
<div class="demo-bar" role="region" aria-label="Pilotage de la maquette">
  <svg width="16" height="16" aria-hidden="true"><use href="#ic-alert"/></svg>
  <span>MAQUETTE B2F — données fictives « DÉMO ». Ne reflète aucune entreprise réelle.</span>
  <div class="demo-controls">
    <label for="demo-role" class="sr-only">Rôle démontré</label>
    <select id="demo-role">
      <option value="affreteur">Affréteur — Ivoire Cacao Export</option>
      <option value="transporteur">Transporteur — Trans Lagunes</option>
      <option value="auxiliaire">Auxiliaire — sous-compte affréteur</option>
      <option value="concessionnaire">Concessionnaire — exploitant OIC</option>
      <option value="dgttc">DGTTC — autorité de contrôle</option>
    </select>
    <label for="demo-screen" class="sr-only">Écran</label>
    <select id="demo-screen"></select>
    <button type="button" class="btn btn-sm btn-secondary" id="demo-login">Écran de connexion</button>
  </div>
</div>

<div id="app"></div>

<!-- ===================================================================
     ÉCRAN — Connexion. Porte l'identité B2F.
     =================================================================== -->
<template id="tpl-login">
<div class="auth-page">
  <section class="auth-visual">
    <div class="auth-wordmark">
      <span class="mark">B2F</span>
      <span>BOURSE DE FRET · OFFICE IVOIRIEN DES CHARGEURS</span>
    </div>
    <span class="overline">Mettre en relation le fret et la route</span>
    <h1>Votre fret déclaré.<br>Votre transporteur trouvé.</h1>
    <p>Déclarez votre marchandise, comparez les véhicules disponibles<br>et engagez la mise en relation en toute traçabilité.</p>
    <div class="auth-assurance">
      <span><svg width="18" height="18" aria-hidden="true"><use href="#ic-package"/></svg> Un fret déclaré</span>
      <span><svg width="18" height="18" aria-hidden="true"><use href="#ic-handshake"/></svg> Une double validation</span>
      <span><svg width="18" height="18" aria-hidden="true"><use href="#ic-truck"/></svg> Un transport suivi</span>
    </div>
  </section>
  <div>
    <div class="auth-card">
      <h2>Connexion</h2>
      <p class="auth-sub">Accédez à l'espace de votre groupement.</p>
      <div class="field">
        <label for="login-mail">Adresse électronique</label>
        <input class="input" id="login-mail" type="email" placeholder="vous@entreprise.ci" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pwd">Mot de passe</label>
        <input class="input" id="login-pwd" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg">Se connecter</button>
      <div class="auth-demo-divider">ou entrer avec un compte de démonstration</div>
      <button type="button" class="demo-account-btn" data-role="affreteur">
        <span><strong>Affréteur</strong><small>Ivoire Cacao Export — DÉMO</small></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
      </button>
      <button type="button" class="demo-account-btn" data-role="transporteur">
        <span><strong>Transporteur</strong><small>Trans Lagunes — DÉMO</small></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
      </button>
      <button type="button" class="demo-account-btn" data-role="auxiliaire">
        <span><strong>Auxiliaire</strong><small>Sous-compte d'Ivoire Cacao Export — DÉMO</small></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
      </button>
      <button type="button" class="demo-account-btn" data-role="concessionnaire">
        <span><strong>Concessionnaire</strong><small>Exploitant de la plateforme — DÉMO</small></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
      </button>
      <button type="button" class="demo-account-btn" data-role="dgttc">
        <span><strong>DGTTC</strong><small>Autorité de contrôle — consultation seule — DÉMO</small></span>
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg>
      </button>
    </div>
  </div>
</div>
</template>

<script src="b2f-maquette.js"></script>
</body>
</html>
