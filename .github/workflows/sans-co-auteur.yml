# Aucune mention d'outil ni de co-auteur dans l'historique (règle du porteur,
# reprise de la garde de DGPSP) : ni ligne Co-Authored-By, ni trace de session,
# ni auteur/committer d'outil, ni pied de page d'outil dans la description de PR.
# - pull_request : vérifie les commits de la PR et sa description.
# - push : vérifie uniquement les commits nouveaux sur la branche poussée
#   (l'historique antérieur n'est pas rejugé).
name: Sans co-auteur

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:

permissions:
  contents: read

concurrency:
  group: sans-co-auteur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sans-co-auteur:
    if: github.event_name == 'pull_request' || github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, épinglé par SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier les commits et la description
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          BRANCHE: ${{ github.ref_name }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          motif='^[[:space:]]*(co-authored-by|claude-session)[[:space:]]*:'
          interdits='noreply@anthropic\.com|generated with \[claude|generated by \[claude|claude\.ai/code'
          zero=0000000000000000000000000000000000000000

          if [ "${EVENEMENT}" = pull_request ]; then
            commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          elif [ "${AVANT}" != "${zero}" ] && git cat-file -e "${AVANT}^{commit}" 2>/dev/null; then
            commits=$(git rev-list "${AVANT}..${APRES}")
          else
            # Nouvelle branche (ou base inconnue) : seulement les commits
            # absents de toutes les autres branches du dépôt.
            autres=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
              | grep -vx "refs/remotes/origin/${BRANCHE}" | grep -vx 'refs/remotes/origin/HEAD' || true)
            # shellcheck disable=SC2086
            commits=$(git rev-list "${APRES}" ${autres:+--not ${autres}})
          fi

          echec=0
          for sha in ${commits}; do
            if git log -1 --format=%B "${sha}" | grep -Eiq "${motif}|${interdits}"; then
              echo "::error::Commit ${sha} : mention de co-auteur ou d'outil dans le message."
              echec=1
            fi
            if git log -1 --format='%ae %ce' "${sha}" | grep -Eiq 'noreply@anthropic\.com'; then
              echo "::error::Commit ${sha} : auteur ou committer d'outil."
              echec=1
            fi
          done
          if [ "${EVENEMENT}" = pull_request ] && printf '%s' "${DESCRIPTION}" | grep -Eiq "${motif}|${interdits}"; then
            echo "::error::Description de la PR : mention de co-auteur ou d'outil."
            echec=1
          fi
          [ "${echec}" -eq 0 ] && echo "Aucune mention de co-auteur ($(printf '%s\n' ${commits} | grep -c . || true) commit(s) vérifié(s))."
          exit "${echec}"
